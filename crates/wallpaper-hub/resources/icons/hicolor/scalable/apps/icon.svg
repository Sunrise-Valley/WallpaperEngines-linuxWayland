<?xml version="1.0" encoding="UTF-8"?>
<!-- Wallpaper Hub —— 场景(Scene)壁纸的意象：圆角屏幕里有天空、太阳、山与水面反光 -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="0.55" stop-color="#e08a6a"/>
      <stop offset="1" stop-color="#2b3b63"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5f9e"/>
      <stop offset="1" stop-color="#16233d"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2b45"/>
      <stop offset="1" stop-color="#0d1729"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="6" y="16" width="116" height="96" rx="18"/>
    </clipPath>
  </defs>

  <!-- 屏幕外框 -->
  <rect x="6" y="16" width="116" height="96" rx="18" fill="#0d1729"/>

  <g clip-path="url(#screen)">
    <!-- 天空 -->
    <rect x="6" y="16" width="116" height="96" fill="url(#sky)"/>
    <!-- 太阳 -->
    <circle cx="86" cy="52" r="13" fill="#ffd070" opacity="0.95"/>
    <!-- 水面 -->
    <rect x="6" y="82" width="116" height="30" fill="url(#water)"/>
    <!-- 太阳在水面的反光 -->
    <rect x="72" y="84" width="28" height="3" rx="1.5" fill="#ffe6a8" opacity="0.55"/>
    <rect x="77" y="90" width="18" height="3" rx="1.5" fill="#ffe6a8" opacity="0.4"/>
    <rect x="82" y="96" width="9" height="3" rx="1.5" fill="#ffe6a8" opacity="0.28"/>
    <!-- 远山 -->
    <path d="M6 82 L34 54 L54 74 L70 60 L92 82 Z" fill="#2a3f66" opacity="0.85"/>
    <!-- 近山 -->
    <path d="M6 82 L28 66 L48 82 Z" fill="url(#near)"/>
    <path d="M62 82 L84 62 L108 82 Z" fill="url(#near)"/>
    <!-- 一条流动感的光带（呼应动态壁纸） -->
    <path d="M6 74 C 30 68, 46 80, 70 72 C 92 65, 108 76, 122 70"
          fill="none" stroke="#8fd0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- 屏幕高光边框 -->
  <rect x="6" y="16" width="116" height="96" rx="18"
        fill="none" stroke="#9dc1ff" stroke-width="2" opacity="0.55"/>
</svg>
