[package]
name = "we-scene-render"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "GL/EGL scene renderer: pass pipeline, puppet meshes, effect chain, render targets, masks, linked layers"

[lib]
name = "we_scene_render"
path = "src/lib.rs"

[[bin]]
name = "we-scene-render"
path = "src/main.rs"

[dependencies]
we-scene = { path = "../we-scene" }
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
glow = "0.16.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Text objects: font rasterization, pure Rust with no C dependency.
ab_glyph = "0.2"
# Text objects embed editor-generated JavaScript, so a real JS engine runs it
# instead of us pattern-matching the generated source.
boa_engine = { version = "0.20", default-features = false, features = ["annex-b"] }
# Zero-copy mode dlopen()s libwayland-egl: systems ship only the .so.1 soname.
libc = "0.2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = true
