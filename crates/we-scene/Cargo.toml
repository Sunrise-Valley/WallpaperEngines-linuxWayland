[package]
name = "we-scene"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Parser for Wallpaper Engine scene packages (PKGV container, TEX textures, scene.json scene graph)"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"
strip = true
